<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<meta name="description" content="Misyon Koruma sınavı soru bankası ve test platformu">
<title>Misyon Koruma · Soru Bankası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="btnBack" data-act="back" aria-label="Geri">‹</button>
  <h1 class="topbar-title" id="topTitle">Misyon Koruma</h1>
  <button class="icon-btn" id="btnHome" data-act="home" aria-label="Ana sayfa">⌂</button>
</header>
<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>
<noscript><p class="noscript">Uygulamanın çalışması için JavaScript gereklidir.</p></noscript>

<script>
  // Dosya yükleme / yazım hatalarını yakala ve uygulamada göster
  window.__loadErrors = [];
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') window.__loadErrors.push(e.target.getAttribute('src') + ' bulunamadı (dosya adı ve konumu doğru mu?)');
    else if (e.filename) window.__loadErrors.push(e.filename.split('/').pop() + ' satır ' + e.lineno + ': ' + e.message);
  }, true);
</script>
<script src="config.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
